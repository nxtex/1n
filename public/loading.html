<title>One network — Chargement</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f8fc; --ink:#07142e; --blue:#3158ce; --track:rgba(7,20,46,.12);
  --glow:rgba(49,88,206,.07);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 55%,#ffffff 0%,#f8faff 38%,var(--bg) 75%);display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.stage{position:relative;width:min(760px,88vw);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vw,34px)}
.stage::before{content:"";position:absolute;inset:-30% -10%;background:radial-gradient(closest-side,var(--glow),transparent 70%);z-index:0;pointer-events:none}
svg{position:relative;z-index:1;width:100%;height:auto;max-width:100%;overflow:visible}
.b{fill:var(--blue)} .d{fill:var(--ink)}
svg [data-r]{transform-box:fill-box;transform-origin:50% 50%}
.bar{position:relative;z-index:1;width:min(180px,40vw);height:3px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transform-origin:left center;transform:scaleX(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .bar i{transform:scaleX(1);animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} }
</style>

<script>
(function(){
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function finish(){ if (window.parent !== window) window.parent.postMessage({type:"one-network-loader-finished"}, window.location.origin); }
  if (reduced || !Element.prototype.animate) { var fill = document.getElementById("fill"); if (fill) fill.style.transform = "scaleX(1)"; window.setTimeout(finish, reduced ? 500 : 900); return; }
  var T = 6800, EXIT_A = 6000, EXIT_B = 6500;
  var q = function(r){ return Array.prototype.slice.call(document.querySelectorAll('[data-r="'+r+'"]')); };
  var o = q('o'), ne = q('ne'), net = q('net'), dot = q('dot');
  var EASE = "cubic-bezier(.65,0,.35,1)", OUT = "cubic-bezier(.22,1,.36,1)";
  function opts(){ return { duration:T, iterations:1, fill:"both" }; }
  function f(ms){ return Math.min(1, ms/T); }

  // O : apparaît seul, tourne comme un loader, puis glisse à sa place
  var DX = 919.5, DY = -2, c = "translate("+DX+"px,"+DY+"px) ";
  o.forEach(function(el){
    el.animate([
      { offset:0, opacity:0, transform:c+"scale(.45) rotate(-200deg)", easing:OUT },
      { offset:f(750), opacity:1, transform:c+"scale(1.3) rotate(0deg)", easing:EASE },
      { offset:f(2600), opacity:1, transform:c+"scale(1.3) rotate(720deg)", easing:EASE },
      { offset:f(3400), opacity:1, transform:"translate(0,0) scale(1) rotate(720deg)" },
      { offset:f(EXIT_A), opacity:1, transform:"translate(0,0) scale(1) rotate(720deg)", easing:"ease-in" },
      { offset:f(EXIT_B), opacity:0, transform:"translate(0,0) scale(1) rotate(720deg)" },
      { offset:1, opacity:0, transform:"translate(0,0) scale(1) rotate(720deg)" }
    ], opts());
  });

  // lettres : "ne" puis "network", de gauche à droite
  function letter(el, start, dur, from){
    el.animate([
      { offset:0, opacity:0, transform:from },
      { offset:f(start), opacity:0, transform:from, easing:OUT },
      { offset:f(start+dur), opacity:1, transform:"none" },
      { offset:f(EXIT_A), opacity:1, transform:"none", easing:"ease-in" },
      { offset:f(EXIT_B), opacity:0, transform:"translateY(-10px)" },
      { offset:1, opacity:0, transform:from }
    ], opts());
  }
  ne.forEach(function(el){ letter(el, 3300 + (+el.dataset.i)*140, 650, "translateX(-60px)"); });
  net.forEach(function(el){ letter(el, 4050 + (+el.dataset.i)*110, 650, "translateX(-40px)"); });
  dot.forEach(function(el){
    el.animate([
      { offset:0, opacity:0, transform:"scale(0)" },
      { offset:f(4900), opacity:0, transform:"scale(0)", easing:"cubic-bezier(.34,1.8,.64,1)" },
      { offset:f(5350), opacity:1, transform:"scale(1)" },
      { offset:f(EXIT_A), opacity:1, transform:"scale(1)", easing:"ease-in" },
      { offset:f(EXIT_B), opacity:0, transform:"scale(1)" },
      { offset:1, opacity:0, transform:"scale(0)" }
    ], opts());
  });
  // barre de progression
  var bar = document.getElementById("fill");
  bar.animate([
    { offset:0, opacity:0, transform:"scaleX(0)" },
    { offset:f(500), opacity:1, transform:"scaleX(0)", easing:"cubic-bezier(.4,0,.2,1)" },
    { offset:f(5700), opacity:1, transform:"scaleX(1)" },
    { offset:f(EXIT_A), opacity:1, transform:"scaleX(1)" },
    { offset:f(EXIT_B), opacity:0, transform:"scaleX(1)" },
    { offset:1, opacity:0, transform:"scaleX(0)" }
  ], opts());
  window.setTimeout(finish, EXIT_B + 80);
})();
</script>
